<style>
:root{--be:#D4C3B3;--pk:#FF5BB5;--pu:#4B1B35;--tx:#2a1f18;--h:46px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;display:flex;flex-wrap:wrap;min-height:100vh;background:#E9E2D9;font:14px/1.4 'Geist Mono',ui-monospace,Menlo,monospace;color:var(--tx)}
aside{width:380px;max-width:100%;max-height:100vh;overflow-y:auto;background:#fff;display:flex;flex-direction:column}aside>*{flex:none}
main{position:relative;flex:1;min-width:300px;display:flex;align-items:center;justify-content:center;padding:20px}
#logo{position:absolute;top:18px;right:22px;width:64px;line-height:0;pointer-events:none}#logo svg{width:100%;height:auto}
i[data-i]{display:inline-flex;align-items:center;line-height:0}i[data-i] svg{display:block;height:auto}
i[data-i=sup] svg{width:14px}i[data-i=act] svg{width:20px}i[data-i=ale] svg{width:22px}i[data-i=ann] svg,i[data-i=ref] svg{width:16px}i[data-i=enr] svg{width:32px}i[data-i=der] svg{width:12px}i[data-i=imp] svg{width:20px}i[data-i=rei] svg{width:26px}i[data-i=gli] svg{width:22px}
.top{background:var(--be);padding:22px 20px 26px}
.H{font:400 27px/1.1 'Helvetica Neue',Helvetica,Arial,sans-serif;margin:26px 0 14px}.top .H:first-child{margin-top:0}
.f{margin-top:14px}.lb{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px;color:#4d3f35}
.selw select,#cust input,.dr input[type=text],.dr textarea{width:100%;border:0;border-radius:0;background:#000;color:#fff;font:inherit;padding:0 14px}

#cust{display:none;gap:8px;margin-top:8px}#cust input{height:var(--h)}
.dr input[type=text]{height:var(--h)}.dr textarea{padding:12px 14px;min-height:104px;resize:none;overflow:hidden;display:block}
input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:var(--h);margin:0;padding:0;border-radius:999px;cursor:pointer;outline:none;background:linear-gradient(to right,var(--pu) calc(26px + (100% - 52px) * var(--pf,.5)),#000 0)}
input[type=range]::-webkit-slider-runnable-track{height:var(--h);background:transparent;border:0}

input[type=range]::-moz-range-thumb{box-sizing:border-box;width:52px;height:var(--h);border-radius:999px;border:0;background:var(--pk) url("data:image/svg+xml,%3Csvg viewBox='0 0 25 13' fill='none' xmlns='http://www.w3.org/2000/svg'%3E %3Cpath d='M0.962395 8.24413C-0.320799 7.30469 -0.320798 5.38892 0.962396 4.44947L6.41392 0.458338C7.96733 -0.678936 10.1544 0.430445 10.1544 2.35567V10.3379C10.1544 12.2632 7.96733 13.3725 6.41392 12.2353L0.962395 8.24413Z' fill='white'/%3E %3Cpath d='M23.2656 4.44947C24.5488 5.38891 24.5488 7.30468 23.2656 8.24413L17.814 12.2353C16.2606 13.3725 14.0735 12.2632 14.0735 10.3379L14.0735 2.35566C14.0735 0.430444 16.2606 -0.678937 17.814 0.458336L23.2656 4.44947Z' fill='white'/%3E %3C/svg%3E") center no-repeat;background-size:18px auto}
button{font:inherit;cursor:pointer}button:disabled{opacity:.4;cursor:default}
.pkb{width:100%;height:var(--h);border:0;background:var(--pk);color:#fff;display:flex;align-items:center;justify-content:center;gap:10px}
.two{display:flex;gap:12px}.pill{flex:1;height:var(--h);border:0;border-radius:999px;background:var(--pk);color:#fff;display:flex;align-items:center;justify-content:center;gap:10px}
.adds{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.adds button{grid-column:span 2;height:var(--h);border:0;background:#000;color:#fff;padding:0 6px}.adds button:nth-child(n+4){grid-column:span 3}
.sw{display:flex;height:var(--h);border-radius:999px;overflow:hidden}.sw button{flex:1;border:0;background:#000;color:#fff;display:flex;align-items:center;justify-content:center}
.sw[data-on="1"] button[data-v="1"],.sw[data-on="0"] button[data-v="0"]{background:var(--pk)}
.dr{border-bottom:5px solid var(--be);background:#fff}.dr header{display:flex;align-items:center;gap:12px;padding:20px;cursor:pointer}
.dr h3{flex:1;margin:0;font:400 27px/1 'Helvetica Neue',Helvetica,Arial,sans-serif}.dr .x{border:0;background:none;padding:2px;display:flex;color:#000}
.chev{color:#000;transition:transform .15s}.dr.open .chev{transform:rotate(180deg)}.dr .bd{display:none;padding:0 20px 22px}.dr.open .bd{display:block}
.up{display:flex;height:var(--h)}.up .ff{flex:1;display:flex;align-items:center;padding:0 12px;background:#000;color:#fff;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up .ff.gr{background:#cfcfcf;color:#888}.top .up .ff.gr{background:#a89b8d;color:#e9e1d8}.up .sq{width:var(--h);border:0;background:var(--pk);color:#fff;display:flex;align-items:center;justify-content:center}
.up.on{outline:2px solid var(--pk);outline-offset:2px}
.stp{display:flex;align-items:center;justify-content:space-between;height:var(--h);padding:0 0 0 14px;background:#000;color:#fff}
.ic2{position:relative;display:flex;width:56px;height:100%;align-items:center;justify-content:center}.ic2 button{position:absolute;top:0;bottom:0;width:50%;background:none;border:0}.ic2 button:first-of-type{left:0}.ic2 button:last-of-type{right:0}
.cb{position:relative}.cbf{display:flex;height:var(--h);background:#000}
.dr .cbf input[type=text]{flex:1;min-width:0;width:auto;height:100%;background:transparent;outline:none}
.cbf button{width:var(--h);border:0;background:none;color:#fff;display:flex;align-items:center;justify-content:center}
.cbl{display:none;position:absolute;left:0;right:0;top:100%;z-index:30;max-height:240px;overflow-y:auto;background:#000;border-top:1px solid #333}.cb.open .cbl{display:block}
.cbo{padding:10px 14px;color:#fff;cursor:pointer;font-size:13px}.cbo:hover,.cbo.on{background:var(--pk)}
#msg{font-size:12px;margin-top:10px;color:#4d3f35;min-height:1em}
#print{position:sticky;bottom:0;margin-top:auto;height:88px;border:0;background:var(--pk);color:#fff;display:flex;align-items:center;justify-content:center;gap:14px;font:400 31px 'Helvetica Neue',Helvetica,Arial,sans-serif}
#page{position:relative;background:#fff;overflow:hidden;color:#111;user-select:none;touch-action:none}
.b{position:absolute;overflow:hidden}.b[data-id]{touch-action:none}
.o .b{outline:1px dashed var(--c);background:color-mix(in srgb,var(--c) 8%,transparent)}
.o .b::after{content:attr(data-l);position:absolute;top:2px;left:3px;font:10px system-ui;color:var(--c);background:#fffd;padding:0 3px;border-radius:2px;pointer-events:none}
.b.dg2{z-index:6;opacity:.88}
.b.sel{outline:1px solid var(--c)!important;background:color-mix(in srgb,var(--c) 20%,transparent)}
.mg{position:absolute;pointer-events:none;border:1px dotted #bbb;display:none}.o .mg{display:block}
.b.shape,.b.shape.sel{outline:none!important;background:none!important}.o .b.shape::after{display:none}
#ov{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.in{width:100%;height:100%;display:flex;overflow:hidden}.c{width:100%;overflow-wrap:anywhere;hyphens:auto;-webkit-hyphens:auto;white-space:pre-wrap}
.ln{position:absolute;white-space:nowrap}
.titre .in{align-items:center}.titre .c,.titre .ln{font-family:var(--f);font-weight:700;line-height:1.02}
.texte .in{align-items:flex-start}.texte .c{font-family:var(--f);line-height:1.25}.texte .ln{font-family:var(--f)}
.b img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.pn{background:#fff;cursor:grab;transition:left .15s}.pn.dg{transition:none;z-index:5;cursor:grabbing;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.pn img{object-fit:contain;padding:8%}.pn .in{align-items:center;justify-content:center;text-align:center}.pn .c{text-align:center;color:#aaa;font-family:system-ui,sans-serif}
#page:not(.o) .ph{visibility:hidden}
.ed{position:absolute;z-index:20;background:#fff;color:#111;border:1px solid #e4572e;padding:4px;resize:none;outline:none;user-select:text;-webkit-user-select:text;box-sizing:border-box}
#page.pr .b{outline:none!important;background:none!important}#page.pr .b::after,#page.pr .mg,#page.pr #ov,#page.pr .ph,#page.pr .ed{display:none}#page.pr .pn{box-shadow:none;background:#fff!important}

<aside>
<div class="top">
<h2 class="H">Document</h2>
<div class="f"><div class="lb"><span>Format</span></div><div class="selw"><select id="fmt"></select></div>
<div id="cust"><input type="number" id="cw" min="50" max="3000" placeholder="Largeur (mm)"><input type="number" id="ch" min="50" max="3000" placeholder="Hauteur (mm)"></div></div>
<div class="f"><div class="lb"><span>Marge</span><span id="vmg">10 mm</span></div><input type="range" id="mg" min="0" max="100" value="10"></div>
<h2 class="H">Blocs</h2>
<div class="f"><div class="lb"><span>Agencement</span></div><button class="pkb" id="rnd"><i data-i="ale"></i>Aléatoire</button></div>
<div class="f"><div class="lb"><span>Agencement automatique</span></div><div class="sw" id="auto" data-on="1"></div></div>
<div class="f"><div class="lb"><span>Grille Voronoï</span></div><div class="sw" id="shp" data-on="0"></div></div>
<div class="f"><div class="lb"><span>Espace entre les blocs</span><span id="vgp">3 mm</span></div><input type="range" id="gp" min="0" max="30" value="3"></div>
<div class="f"><div class="lb"><span>Ajouter des blocs</span></div><div class="adds"><button data-add="titre">Titre</button><button data-add="texte">Texte</button><button data-add="illu">Illustration</button><button data-add="part" id="addp">Bandeau partenaires</button><button data-add="vide">Bloc vide</button></div></div>
<h2 class="H">Actions</h2>
<div class="two"><button class="pill" id="undo"><i data-i="ann"></i>Annuler</button><button class="pill" id="redo"><i data-i="ref"></i>Refaire</button></div>
<div class="f"><button class="pkb" id="reset"><i data-i="rei"></i>Réinitialiser</button></div>
<h2 class="H">Affichage</h2>
<div class="f"><div class="lb"><span>Contours du bloc</span></div><div class="sw" id="cont" data-on="1"></div></div><div id="msg"></div>
<h2 class="H">Préréglage</h2>
<div class="f"><div class="lb"><span>Enregistrer le préréglage</span></div><button class="pkb" id="psave">Enregistrer cette composition</button></div>
<div class="f"><div class="lb"><span>Appliquer un préréglage</span></div><div id="prow"></div><input type="file" id="pfile" accept=".json,application/json" hidden></div>
</div>
<div id="drs"></div>
<button id="print"><i data-i="enr"></i><span id="pl">Imprimer</span></button>
</aside>
<main><div id="logo"></div><div id="page"></div></main>
